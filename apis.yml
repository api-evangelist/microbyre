aid: microbyre
name: MicroByre
description: >-
  MicroByre was a Berkeley, California synthetic biology company founded in 2017 by CEO
  and co-founder Sarah Richardson to "domesticate" wild-type bacteria — building an
  automated characterization and genetic-tool pipeline that made naturally occurring,
  never-before-engineered microbes tractable so they could ferment unrefined waste
  biomass into commodity chemicals, enzymes, food ingredients and probiotics at costs
  petrochemical routes could not match. It raised roughly $20.5M, including backing from
  Prime Coalition's Prime Impact Fund, and went out of business; Prime Coalition lists it
  as "no longer active" and C&EN reported the shutdown. MicroByre was a wet-lab platform
  company, not a software vendor: it published no developer program, no API, and no
  machine-readable contract, and its own domain no longer resolves to a web server.
